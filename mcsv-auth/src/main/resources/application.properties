# Configuración de PostgreSQL

quarkus.hibernate-orm.database.start-offline=true
quarkus.hibernate-orm.database.version-check.enabled=false


quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${MS_AUTH_DB_USER:admin}
quarkus.datasource.password=${MS_AUTH_DB_PASS:admin}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${MS_AUTH_DB_NAME:db_auth}

quarkus.hibernate-orm.database.default-schema=data
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Configuración de JWT
# mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# quarkus.smallrye-jwt.sign.key-location=META-INF/resources/privateKey.pem

# Configuración de JWT con archivos en el mismo directorio
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

mp.jwt.verify.issuer=https://auth-service.kuarqus.com

# Rutas públicas (necesarias para poder autenticarse)
quarkus.http.auth.permission.public.paths=/auth/login,/auth/register,/auth/refresh,/q/*
quarkus.http.auth.permission.public.policy=permit

# GET /users/{id} es de uso interno servicio-a-servicio (ej. ms-notificaciones resolviendo el
# email/nombre real de un colaborador), igual que ms-solicitud -> ms-politicas: sin JWT, llamado
# directo entre contenedores, nunca expuesto al frontend a traves del gateway.
quarkus.http.auth.permission.internal-users-get.paths=/users/*
quarkus.http.auth.permission.internal-users-get.methods=GET
quarkus.http.auth.permission.internal-users-get.policy=permit

# /users/* es el path mas especifico que existe para esta ruta: una vez que un permission-set
# lo reclama (internal-users-get, solo GET), Quarkus NO cae al catch-all /* para otros metodos
# en esa misma ruta. Por eso PUT/POST/DELETE sobre /users/* necesitan su propio permission-set
# explicito, o quedarian denegados con 403 en vez de heredar la politica "authenticated".
quarkus.http.auth.permission.users-write.paths=/users/*
quarkus.http.auth.permission.users-write.methods=PUT,POST,DELETE
quarkus.http.auth.permission.users-write.policy=authenticated

# Todo lo demás requiere JWT válido
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# JWT Token Configuration
jwt.issuer=https://auth-service.kuarqus.com
jwt.duration=3600
jwt.refresh.duration=86400


# HTTP Configuration
quarkus.http.port=9001
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# quarkus.smallrye-jwt.token.header=Authorization
# quarkus.smallrye-jwt.token.cookie=
# quarkus.smallrye-jwt.auth-mechanism=MP-JWT
# quarkus.smallrye-jwt.expiration=3600

quarkus.log.console.enable=true
quarkus.log.console.color=true
quarkus.log.console.level=INFO
quarkus.log.level=INFO

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n


quarkus.profile=dev

# -----------------------------------------------------------------------------
# Kafka — Productor: usuario.registrado
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}
mp.messaging.outgoing.usuario-registrado-out.connector=smallrye-kafka
mp.messaging.outgoing.usuario-registrado-out.topic=usuario.registrado
mp.messaging.outgoing.usuario-registrado-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=mcsv-auth API
quarkus.smallrye-openapi.info-version=1.0.0

