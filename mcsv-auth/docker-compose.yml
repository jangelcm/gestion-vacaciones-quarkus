version: "3.9"

name: kafka-kraft-cluster

services:
  controller-1:
    image: bitnami/kafka:latest
    container_name: controller-1
    hostname: controller-1
    restart: unless-stopped
    networks:
      - kafka-net
    volumes:
      - controller1_data:/bitnami/kafka
    environment:
      # KRaft
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-001

      # Nodo
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller

      # Quorum de controllers
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Listeners
      - KAFKA_CFG_LISTENERS=CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # Logs / dirs
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data

      # Permitir PLAINTEXT para laboratorio
      - ALLOW_PLAINTEXT_LISTENER=yes

  controller-2:
    image: bitnami/kafka:latest
    container_name: controller-2
    hostname: controller-2
    restart: unless-stopped
    networks:
      - kafka-net
    volumes:
      - controller2_data:/bitnami/kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-001

      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=controller

      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      - KAFKA_CFG_LISTENERS=CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      - ALLOW_PLAINTEXT_LISTENER=yes

  controller-3:
    image: bitnami/kafka:latest
    container_name: controller-3
    hostname: controller-3
    restart: unless-stopped
    networks:
      - kafka-net
    volumes:
      - controller3_data:/bitnami/kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-001

      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=controller

      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      - KAFKA_CFG_LISTENERS=CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      - ALLOW_PLAINTEXT_LISTENER=yes

  broker-1:
    image: bitnami/kafka:latest
    container_name: broker-1
    hostname: broker-1
    restart: unless-stopped
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    ports:
      - "19092:19092"
    networks:
      - kafka-net
    volumes:
      - broker1_data:/bitnami/kafka
    environment:
      # KRaft
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-001

      # Nodo
      - KAFKA_CFG_NODE_ID=101
      - KAFKA_CFG_PROCESS_ROLES=broker

      # Quorum controllers
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Listeners:
      # INTERNAL -> tráfico entre brokers / red Docker
      # EXTERNAL -> acceso desde tu host
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://broker-1:9092,EXTERNAL://localhost:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      # Controller listener names:
      # en broker no expone CONTROLLER listener, pero sí debe saber cuál usa el quorum
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # Logs / dirs
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data

      # Parámetros útiles para laboratorio
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2

      - ALLOW_PLAINTEXT_LISTENER=yes

  broker-2:
    image: bitnami/kafka:latest
    container_name: broker-2
    hostname: broker-2
    restart: unless-stopped
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    ports:
      - "19093:19093"
    networks:
      - kafka-net
    volumes:
      - broker2_data:/bitnami/kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-001

      - KAFKA_CFG_NODE_ID=102
      - KAFKA_CFG_PROCESS_ROLES=broker

      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://broker-2:9092,EXTERNAL://localhost:19093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2

      - ALLOW_PLAINTEXT_LISTENER=yes

  broker-3:
    image: bitnami/kafka:latest
    container_name: broker-3
    hostname: broker-3
    restart: unless-stopped
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    ports:
      - "19094:19094"
    networks:
      - kafka-net
    volumes:
      - broker3_data:/bitnami/kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-001

      - KAFKA_CFG_NODE_ID=103
      - KAFKA_CFG_PROCESS_ROLES=broker

      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://broker-3:9092,EXTERNAL://localhost:19094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2

      - ALLOW_PLAINTEXT_LISTENER=yes

networks:
  kafka-net:
    driver: bridge

volumes:
  controller1_data:
  controller2_data:
  controller3_data:
  broker1_data:
  broker2_data:
  broker3_data: