# Puerto en el que escucha el gateway
quarkus.http.port=8080

# Backend por defecto para rutas no mapeadas explícitamente
gateway.target.host=ms-solicitud
gateway.target.port=8080

%dev.quarkus.log.category."com.example.gateway".level=DEBUG

# Ejemplo (opcional): mapear rutas desde configuración al arrancar
# gateway.routes=/auth:localhost:9001,/api:localhost:9002

# Para agregar rutas manualmente, edita src/main/resources/routes.json (no hace falta
# tocar código). Cada ruta tiene un flag 'requiresJwt' para exigir un JWT válido en esa
# ruta, y 'stripPrefix' para sacar el primer segmento de la URL al reenviar.
# Se puede apuntar a otro archivo del classpath con:
# gateway.routes.file=otro-nombre.json

# --- Validación JWT (misma clave pública y emisor que usa mcsv-auth) ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://auth-service.kuarqus.com


# --- CORS: permite que el frontend (otro origen) llame al gateway desde el navegador ---
# Sin esto, el navegador bloquea las respuestas por la política same-origin (el error típico
# es "No 'Access-Control-Allow-Origin' header" en la consola del navegador).
quarkus.http.cors.enabled=true
# Orígenes permitidos, separados por coma. Agrega acá cada frontend que necesite llamar al
# gateway (dev, staging, prod). Nunca uses "*" si también activas allow-credentials.
#
# También acepta regex envuelta en "/.../" para matchear varias URLs con un solo patrón, por
# ejemplo cualquier subdominio de tu dominio:
#   quarkus.http.cors.origins=/https:\\/\\/.*\\.miapp\\.com/
quarkus.http.cors.origins=http://localhost:4200,https://staging.miapp.com,https://app.miapp.com
# Métodos y headers que el navegador puede usar en la petición real.
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

