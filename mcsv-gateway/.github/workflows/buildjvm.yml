name: Build JVM Quarkus Application v1
#actualizacion 2
on:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

        env:
          MAVEN_USERNAME: ${{ secrets.BUILD_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.BUILD_TOKEN }}

      - name: Validate Maven secrets
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.BUILD_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          test -n "$MAVEN_USERNAME" || { echo "BUILD_USERNAME is empty"; exit 1; }
          test -n "$MAVEN_TOKEN" || { echo "BUILD_TOKEN is empty"; exit 1; }

      - name: Configure Maven settings
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.BUILD_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Verify Maven settings
        shell: bash
        run: |
          test -f ~/.m2/settings.xml || { echo "settings.xml was not created"; exit 1; }
          grep -q "<id>github</id>" ~/.m2/settings.xml || { echo "github server id missing in settings.xml"; exit 1; }

      - name: Build JVM application
        run: ./mvnw -B --no-transfer-progress clean package -DskipTests

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.BUILD_USERNAME }}
          password: ${{ secrets.BUILD_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.BUILD_USERNAME }}
          password: ${{ secrets.BUILD_TOKEN }}

      - name: Build and push Docker image
        run: |
          # docker build -f src/main/docker/Dockerfile.jvm -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -f src/main/docker/Dockerfile.jvm -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          #comentario