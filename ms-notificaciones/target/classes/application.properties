quarkus.application.name=ms-notificaciones
quarkus.http.port=8084

# -----------------------------------------------------------------------------
# Native image — OpenPDF (comprobante de vacaciones) referencia opcionalmente
# com.lowagie.text.pdf.FopGlyphProcessor (soporte de scripts complejos via Apache
# FOP), dependencia que no declaramos porque no la usamos (solo texto en espanol).
# Quarkus fuerza --link-at-build-time (todo el classpath debe resolver en build),
# por lo que --initialize-at-run-time no alcanza: hay que bajar ese chequeo a
# runtime con ReportUnsupportedElementsAtRuntime, donde nunca se ejecuta este
# codepath.
# -----------------------------------------------------------------------------
# -Djava.net.preferIPv4Stack=true (sin -J): Docker Desktop resuelve smtp.gmail.com con registro
# AAAA (IPv6) pero el ruteo IPv6 real no funciona desde el contenedor; Java intenta conectar por
# IPv6 primero y se cuelga sin RST/timeout de TCP hasta el timeout del Mailer (60s), sin lograrlo
# nunca aunque se agrande el timeout. Forzando IPv4 se evita la ruta rota por completo.
quarkus.native.additional-build-args=--initialize-at-run-time=com.lowagie.text.pdf.FopGlyphProcessor,-H:+ReportUnsupportedElementsAtRuntime,-Djava.net.preferIPv4Stack=true

# OpenPDF carga las metricas de las 14 fuentes estandar (Helvetica, Times, etc.) como
# recursos de classpath (com/lowagie/text/pdf/fonts/*.afm); sin esto no se incluyen en
# el binario nativo y falla "Helvetica-Bold not found as resource" al generar el PDF.
quarkus.native.resources.includes=com/lowagie/text/pdf/fonts/*.afm

# El Mailer usa STARTTLS (SMTP), que necesita SSLContext; sin esto GraalVM no compila
# soporte SSL en el binario nativo y el envio de correo se cuelga hasta el timeout.
quarkus.ssl.native=true

# -----------------------------------------------------------------------------
# MongoDB
# -----------------------------------------------------------------------------
quarkus.mongodb.database=notificaciones_db

# dev/prod: Mongo real en el homelab, sin Dev Services
%!test.quarkus.mongodb.connection-string=mongodb://homelab.local:27017
%!test.quarkus.mongodb.devservices.enabled=false

# test: Mongo Dev Services (Testcontainers efimero), no depende del homelab
%test.quarkus.mongodb.devservices.enabled=true

# -----------------------------------------------------------------------------
# Mailer — SMTP real (dev/prod). En test, Quarkus usa mock=true automaticamente
# (por eso MockMailbox funciona en los tests sin necesitar estas variables).
# -----------------------------------------------------------------------------
quarkus.mailer.from=${MAIL_FROM:no-reply@vacaciones.local}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
quarkus.mailer.auth-methods=${MAIL_AUTH_METHODS:PLAIN}
# Sin esto, un SMTP inalcanzable o sin credenciales (ej. MAIL_USERNAME/PASSWORD vacios en este
# entorno) deja la conexion colgada indefinidamente, bloqueando el hilo del consumer de Kafka
# y con ello el push en vivo por WebSocket que depende del mismo hilo.
#
# 45s (muy por encima de los 5s/15s originales, pensados para JVM): en modo nativo, el
# BlockingMailerImpl.send() interno de Quarkus usa Uni.await().atMost(timeout) para bloquear
# el hilo, pero ese await() SOLO deja de esperar al vencer el timeout — no cancela la conexion
# SMTP real, que sigue corriendo en background. Con 15-20s se observo que la app reportaba
# TimeoutException y marcaba el envio como fallido (cae a solo-WebSocket) mientras la conexion
# real seguia negociando TLS y terminaba enviando el correo igual unos segundos despues, ya sin
# que la app se enterara: un falso negativo. En modo nativo el establecimiento de la conexion TCP
# (antes de que arranque el handshake TLS) tarda entre 20 y 30s (vs. milisegundos en JVM, causa
# raiz aun no identificada con certeza); 45s da margen suficiente para que el await() alcance a
# ver el resultado real en vez de abandonar antes de tiempo.
quarkus.mailer.timeout=${MAIL_TIMEOUT:45s}

# -----------------------------------------------------------------------------
# REST Client — mcsv-auth (resolver email/nombre real del colaborador por id)
# Directo contenedor-a-contenedor, sin gateway ni JWT, igual patron que
# ms-solicitud -> ms-politicas (ver GET /users/{id} publico en mcsv-auth).
# -----------------------------------------------------------------------------
quarkus.rest-client.usuarios-client.url=${AUTH_URL:http://localhost:9001}
%dev.quarkus.rest-client.usuarios-client.url=${AUTH_URL:http://localhost:9001}
quarkus.rest-client.usuarios-client.connect-timeout=3000
quarkus.rest-client.usuarios-client.read-timeout=5000

# -----------------------------------------------------------------------------
# Kafka — Bootstrap
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.aprobada
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-aprobada-in.connector=smallrye-kafka
mp.messaging.incoming.solicitud-aprobada-in.topic=solicitud.aprobada
mp.messaging.incoming.solicitud-aprobada-in.group.id=ms-notificaciones-group
mp.messaging.incoming.solicitud-aprobada-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-aprobada-in.auto.offset.reset=earliest
mp.messaging.incoming.solicitud-aprobada-in.failure-strategy=dead-letter-queue

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.creada
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-creada-in.connector=smallrye-kafka
mp.messaging.incoming.solicitud-creada-in.topic=solicitud.creada
mp.messaging.incoming.solicitud-creada-in.group.id=ms-notificaciones-group
mp.messaging.incoming.solicitud-creada-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-creada-in.auto.offset.reset=earliest
mp.messaging.incoming.solicitud-creada-in.failure-strategy=dead-letter-queue

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.rechazada
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-rechazada-in.connector=smallrye-kafka
mp.messaging.incoming.solicitud-rechazada-in.topic=solicitud.rechazada
mp.messaging.incoming.solicitud-rechazada-in.group.id=ms-notificaciones-group
mp.messaging.incoming.solicitud-rechazada-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-rechazada-in.auto.offset.reset=earliest
mp.messaging.incoming.solicitud-rechazada-in.failure-strategy=dead-letter-queue

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.cancelada
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-cancelada-in.connector=smallrye-kafka
mp.messaging.incoming.solicitud-cancelada-in.topic=solicitud.cancelada
mp.messaging.incoming.solicitud-cancelada-in.group.id=ms-notificaciones-group
mp.messaging.incoming.solicitud-cancelada-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-cancelada-in.auto.offset.reset=earliest
mp.messaging.incoming.solicitud-cancelada-in.failure-strategy=dead-letter-queue

# -----------------------------------------------------------------------------
# Kafka — Productor: notificacion.enviada
# -----------------------------------------------------------------------------
mp.messaging.outgoing.notificacion-enviada-out.connector=smallrye-kafka
mp.messaging.outgoing.notificacion-enviada-out.topic=notificacion.enviada
mp.messaging.outgoing.notificacion-enviada-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
