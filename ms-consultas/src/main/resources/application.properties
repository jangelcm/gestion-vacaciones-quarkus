quarkus.application.name=ms-consultas
quarkus.http.port=8085

# -----------------------------------------------------------------------------
# MongoDB (Read Model CQRS)
# -----------------------------------------------------------------------------
quarkus.mongodb.connection-string=mongodb://${MONGO_INITDB_ROOT_USERNAME:mongo_user}:${MONGO_INITDB_ROOT_PASSWORD:mongo_pass}@${MONGO_HOST:localhost}:27017/?authSource=admin
quarkus.mongodb.database=${MONGO_DB:consultas_db}
quarkus.mongodb.min-pool-size=0

# -----------------------------------------------------------------------------
# Kafka — Configuración Global del Conector (Aplica a los 6 canales)
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}
quarkus.messaging.kafka.health-enabled=false

# Valores por defecto para TODOS los consumidores incoming de Kafka
mp.messaging.connector.smallrye-kafka.group.id=ms-consultas-group
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.failure-strategy=dead-letter-queue

# Mapeo de Canales -> Tópicos de Kafka (Mucho más limpio y rápido de procesar)
mp.messaging.incoming.solicitud-creada-in.topic=solicitud.creada
mp.messaging.incoming.solicitud-aprobada-in.topic=solicitud.aprobada
mp.messaging.incoming.solicitud-rechazada-in.topic=solicitud.rechazada
mp.messaging.incoming.solicitud-cancelada-in.topic=solicitud.cancelada
mp.messaging.incoming.dias-disponibles-actualizados-in.topic=dias.disponibles.actualizados
mp.messaging.incoming.politica-actualizada-in.topic=politica.actualizada

# -----------------------------------------------------------------------------
# Logs y OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
quarkus.log.console.color=true
quarkus.log.console.level=INFO
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

%prod.quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=ms-consultas API
quarkus.smallrye-openapi.info-version=1.0.0