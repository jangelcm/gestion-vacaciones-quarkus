services:
  postgres:
    image: postgres:16-alpine
    container_name: politicas-postgres
    environment:
      POSTGRES_DB: politicas_db
      POSTGRES_USER: politicas
      POSTGRES_PASSWORD: politicas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politicas -d politicas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: