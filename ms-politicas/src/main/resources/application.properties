quarkus.application.name=politicas-service
quarkus.http.port=8081

# CORS deshabilitado: se gestiona exclusivamente en el api-gateway
# quarkus.http.cors.enabled=false  (valor por defecto)

# -----------------------------------------------------------------------------
# Datasource — PostgreSQL
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:politicas_user}
quarkus.datasource.password=${DB_PASS:secret}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:politicas_db}
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.jdbc.timezone=UTC

# ---- Perfil test ----
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false

# -----------------------------------------------------------------------------
# Kafka — Bootstrap
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.aprobada
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-aprobada-in.connector=smallrye-kafka
mp.messaging.incoming.solicitud-aprobada-in.topic=solicitud.aprobada
mp.messaging.incoming.solicitud-aprobada-in.group.id=ms-politicas-group
mp.messaging.incoming.solicitud-aprobada-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-aprobada-in.auto.offset.reset=earliest

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.cancelada
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-cancelada-in.connector=smallrye-kafka
mp.messaging.incoming.solicitud-cancelada-in.topic=solicitud.cancelada
mp.messaging.incoming.solicitud-cancelada-in.group.id=ms-politicas-group
mp.messaging.incoming.solicitud-cancelada-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-cancelada-in.auto.offset.reset=earliest

# -----------------------------------------------------------------------------
# Kafka — Productor: dias.disponibles.actualizados
# -----------------------------------------------------------------------------
mp.messaging.outgoing.dias-disponibles-actualizados-out.connector=smallrye-kafka
mp.messaging.outgoing.dias-disponibles-actualizados-out.topic=dias.disponibles.actualizados
mp.messaging.outgoing.dias-disponibles-actualizados-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# -----------------------------------------------------------------------------
# Kafka — Productor: politica.actualizada
# -----------------------------------------------------------------------------
mp.messaging.outgoing.politica-actualizada-out.connector=smallrye-kafka
mp.messaging.outgoing.politica-actualizada-out.topic=politica.actualizada
mp.messaging.outgoing.politica-actualizada-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer