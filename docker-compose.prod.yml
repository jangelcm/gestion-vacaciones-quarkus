# Override de produccion: quita los puertos publicos de todo lo que no sea el frontend
# (jovaca) y el gateway (mcsv-gateway, 8080). Postgres, MongoDB, Kafka, Kafka UI y cada
# microservicio individual siguen siendo alcanzables entre contenedores por la red interna de
# Docker (vacaciones-net), pero dejan de estar expuestos al host/Internet.
#
# "!reset []" vacia explicitamente la lista de puertos heredada de docker-compose.yml (Compose
# Spec >= 2.24); sin esto, Compose CONCATENA listas en vez de reemplazarlas.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.native.yml -f docker-compose.prod.yml up -d
services:
  # El proveedor del VPS solo deja pasar puertos "conocidos" (80, 443, el SSH configurado) a
  # nivel de firewall de red — 4200 quedaba inalcanzable desde afuera aunque ufw lo permitiera
  # explicitamente. Se expone en el 80 estandar en vez de tocar el firewall del proveedor.
  jovaca:
    ports:
      - "80:4200"

  postgres:
    ports: !reset []

  mongodb:
    ports: !reset []

  kafka:
    ports: !reset []

  kafka-ui:
    ports: !reset []

  ms-solicitud:
    ports: !reset []

  ms-aprobaciones:
    ports: !reset []

  ms-politicas:
    ports: !reset []

  ms-notificaciones:
    ports: !reset []

  ms-consultas:
    ports: !reset []

  ms-reportes:
    ports: !reset []

  mcsv-auth:
    ports: !reset []
