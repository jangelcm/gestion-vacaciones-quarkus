<div class="login-page">
    <form class="login-card" [formGroup]="form" (ngSubmit)="entrar()">
        <div class="login-brand">Portal de Vacaciones</div>
        <p class="login-subtitle">Inicia sesión para continuar</p>

        <label class="field-label" for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" class="input-field"
            placeholder="admin" autocomplete="username" />
        @if (f.username.invalid && f.username.touched) {
        <span class="field-error">El usuario es requerido</span>
        }

        <label class="field-label" for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" class="input-field"
            placeholder="••••••••" autocomplete="current-password" />
        @if (f.password.invalid && f.password.touched) {
        <span class="field-error">La contraseña es requerida</span>
        }

        @if (error()) {
        <div class="login-error">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
            @if (loading()) {
            <span class="spinner"></span> Ingresando...
            } @else {
            Ingresar
            }
        </button>
    </form>
</div>
