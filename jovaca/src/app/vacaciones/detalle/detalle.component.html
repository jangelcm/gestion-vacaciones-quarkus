<div class="status-row">
  <span [class]="'badge ' + badgeClass(solicitud.estado)">{{ solicitud.estado }}</span>
</div>

<div class="card-body">
  <div class="info-row">
    <span class="info-label">ID Solicitud</span>
    <span class="info-value">{{ solicitud.id }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">Colaborador</span>
    <span class="info-value">{{ nombreColaborador ?? ('#' + solicitud.colaboradorId) }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">Fecha de Inicio</span>
    <span class="info-value">{{ solicitud.fechaInicio }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">Fecha de Fin</span>
    <span class="info-value">{{ solicitud.fechaFin }}</span>
  </div>
</div>

<div class="card-footer">
  <button class="btn btn-back" (click)="cerrar.emit()">Cerrar</button>
</div>
