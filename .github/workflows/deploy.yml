name: Build y Deploy (nativo)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_PREFIX: gestion-vacaciones-quarkus

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service:
          - mcsv-auth
          - mcsv-gateway
          - ms-solicitud
          - ms-aprobaciones
          - ms-politicas
          - ms-notificaciones
          - ms-consultas
          - ms-reportes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # -Dquarkus.native.container-build=true compila dentro del builder image de Mandrel
      # (no depende de tener GraalVM instalado en el runner); requiere Docker, ya disponible
      # en los runners de GitHub-hosted.
      - name: Compilar binario nativo
        working-directory: ${{ matrix.service }}
        run: |
          mvn -B clean package -Pnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.native-image-xmx=6g \
            -DskipTests

      - name: Construir imagen Docker
        run: |
          docker build \
            -f ${{ matrix.service }}/src/main/docker/Dockerfile.native \
            -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest \
            ${{ matrix.service }}

      - name: Empaquetar imagen como artefacto
        run: docker save ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest | gzip > ${{ matrix.service }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: images
          pattern: image-*
          merge-multiple: true

      # SSH_PRIVATE_KEY_B64 es la llave codificada en base64 (una sola linea) en vez del PEM
      # multilinea crudo: copiar/pegar un secreto multilinea en el campo de GitHub puede
      # corromper los saltos de linea (CRLF vs LF) y libcrypto rechaza la llave resultante
      # ("error in libcrypto"); base64 de una sola linea no tiene ese problema.
      - name: Preparar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # El repo se clona/actualiza completo en el servidor (no solo los docker-compose*.yml)
      # porque hay volumenes que montan archivos/carpetas del propio repo (./jovaca:/app para
      # el frontend, ./docker/postgres/init-multiple-dbs.sh) — copiar solo los compose files
      # sueltos deja esas rutas inexistentes, y Docker las reemplaza silenciosamente por un
      # directorio vacio ("Is a directory" al arrancar). "git reset --hard" no toca el .env
      # real del servidor porque esta gitignored (nunca es parte del repo).
      - name: Sincronizar repositorio en el servidor
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            if [ -d /opt/gestion-vacaciones-quarkus/.git ]; then
              cd /opt/gestion-vacaciones-quarkus
              git fetch origin main
              git reset --hard origin/main
            else
              # El .env real (fuera de git, gitignored) puede vivir en un directorio que
              # todavia no es un clon (ej. la primera vez que corre este pipeline); se
              # preserva explicitamente antes del rm -rf y se restaura despues del clone.
              [ -f /opt/gestion-vacaciones-quarkus/.env ] && cp /opt/gestion-vacaciones-quarkus/.env /tmp/env-backup || true
              rm -rf /opt/gestion-vacaciones-quarkus
              git clone --depth 1 https://github.com/jangelcm/gestion-vacaciones-quarkus.git /opt/gestion-vacaciones-quarkus
              [ -f /tmp/env-backup ] && mv /tmp/env-backup /opt/gestion-vacaciones-quarkus/.env || true
            fi
          '

      - name: Copiar imagenes al servidor
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" images/*.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/gestion-vacaciones-quarkus/"

      - name: Cargar imagenes y desplegar
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            cd /opt/gestion-vacaciones-quarkus
            for f in *.tar.gz; do gunzip -c "$f" | docker load; done
            rm -f *.tar.gz
            export COMPOSE_PROJECT_NAME=gestion-vacaciones-quarkus
            docker compose -f docker-compose.yml -f docker-compose.native.yml -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
          '
