# =============================================================================
# ms-aprobaciones — Configuración base
# CQRS Write Side | Arquitectura Hexagonal
# =============================================================================

# -----------------------------------------------------------------------------
# Servidor HTTP
# -----------------------------------------------------------------------------
quarkus.http.port=8080

# CORS deshabilitado: se gestiona exclusivamente en el api-gateway
# quarkus.http.cors.enabled=false  (valor por defecto)

# -----------------------------------------------------------------------------
# Datasource — PostgreSQL
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:aprobaciones_user}
quarkus.datasource.password=${DB_PASS:secret}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:aprobaciones_db}

# Estrategia DDL: 'update' en desarrollo, 'validate' o 'none' en producción
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# -----------------------------------------------------------------------------
# Kafka — Bootstrap
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}

# -----------------------------------------------------------------------------
# Kafka — Consumidor: solicitud.creada  (producido por ms-solicitudes)
# -----------------------------------------------------------------------------
mp.messaging.incoming.solicitud-creada.connector=smallrye-kafka
mp.messaging.incoming.solicitud-creada.topic=solicitud.creada
mp.messaging.incoming.solicitud-creada.group.id=ms-aprobaciones-group
mp.messaging.incoming.solicitud-creada.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitud-creada.auto.offset.reset=earliest

# -----------------------------------------------------------------------------
# Kafka — Productor: solicitud.aprobada
# -----------------------------------------------------------------------------
mp.messaging.outgoing.solicitud-aprobada.connector=smallrye-kafka
mp.messaging.outgoing.solicitud-aprobada.topic=solicitud.aprobada
mp.messaging.outgoing.solicitud-aprobada.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# -----------------------------------------------------------------------------
# Kafka — Productor: solicitud.rechazada
# -----------------------------------------------------------------------------
mp.messaging.outgoing.solicitud-rechazada.connector=smallrye-kafka
mp.messaging.outgoing.solicitud-rechazada.topic=solicitud.rechazada
mp.messaging.outgoing.solicitud-rechazada.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=ms-aprobaciones API
quarkus.smallrye-openapi.info-version=1.0.0
