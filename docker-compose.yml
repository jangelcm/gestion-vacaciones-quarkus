services:
  # Base de Datos Relacional (Comandos - Write Model)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-vacaciones
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-vacaciones_user}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-vacaciones_pass}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-db_solicitudes,db_aprobaciones,db_auth,db_politicas}
      MS_SOLICITUD_DB_USER: ${MS_SOLICITUD_DB_USER:-solicitudes_user}
      MS_SOLICITUD_DB_PASS: ${MS_SOLICITUD_DB_PASS:-solicitudes_pass}
      MS_SOLICITUD_DB_NAME: ${MS_SOLICITUD_DB_NAME:-db_solicitudes}
      MS_APROBACIONES_DB_USER: ${MS_APROBACIONES_DB_USER:-aprobaciones_user}
      MS_APROBACIONES_DB_PASS: ${MS_APROBACIONES_DB_PASS:-aprobaciones_pass}
      MS_APROBACIONES_DB_NAME: ${MS_APROBACIONES_DB_NAME:-db_aprobaciones}
      MS_AUTH_DB_USER: ${MS_AUTH_DB_USER:-admin}
      MS_AUTH_DB_PASS: ${MS_AUTH_DB_PASS:-admin}
      MS_AUTH_DB_NAME: ${MS_AUTH_DB_NAME:-db_auth}
      MS_POLITICAS_DB_USER: ${MS_POLITICAS_DB_USER:-politicas_user}
      MS_POLITICAS_DB_PASS: ${MS_POLITICAS_DB_PASS:-politicas_pass}
      MS_POLITICAS_DB_NAME: ${MS_POLITICAS_DB_NAME:-db_politicas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-vacaciones_user}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vacaciones-net

  # Base de Datos NoSQL (Consultas - Read Model / CQRS)
  mongodb:
    image: mongo:6.0
    container_name: mongodb-vacaciones
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_pass}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vacaciones-net

  # Event Broker (Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-vacaciones
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vacaciones-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-vacaciones
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - vacaciones-net

  # UI para monitorear Topics y Mensajes en Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-vacaciones
    ports:
      - "8088:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - vacaciones-net

  ms-solicitud:
    build:
      context: .
      dockerfile: docker/Dockerfile.ms-solicitud
    container_name: ms-solicitud
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${MS_SOLICITUD_DB_NAME:-db_solicitudes}
      DB_USER: ${MS_SOLICITUD_DB_USER:-solicitudes_user}
      DB_PASS: ${MS_SOLICITUD_DB_PASS:-solicitudes_pass}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
    ports:
      - "8082:8080"
    networks:
      - vacaciones-net

  ms-aprobaciones:
    build:
      context: .
      dockerfile: docker/Dockerfile.ms-aprobaciones
    container_name: ms-aprobaciones
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${MS_APROBACIONES_DB_NAME:-db_aprobaciones}
      DB_USER: ${MS_APROBACIONES_DB_USER:-aprobaciones_user}
      DB_PASS: ${MS_APROBACIONES_DB_PASS:-aprobaciones_pass}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
    ports:
      - "8083:8080"
    networks:
      - vacaciones-net

  ms-politicas:
    build:
      context: .
      dockerfile: docker/Dockerfile.ms-politicas
    container_name: ms-politicas
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${MS_POLITICAS_DB_NAME:-db_politicas}
      DB_USER: ${MS_POLITICAS_DB_USER:-politicas_user}
      DB_PASS: ${MS_POLITICAS_DB_PASS:-politicas_pass}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
    ports:
      - "8081:8081"
    networks:
      - vacaciones-net

  ms-notificaciones:
    build:
      context: .
      dockerfile: docker/Dockerfile.ms-notificaciones
    container_name: ms-notificaciones
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo_user}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_pass}@mongodb:27017/notificaciones_db?authSource=admin
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
    ports:
      - "8084:8084"
    networks:
      - vacaciones-net

  mcsv-auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcsv-auth
    container_name: mcsv-auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${MS_AUTH_DB_NAME:-db_auth}
      QUARKUS_DATASOURCE_USERNAME: ${MS_AUTH_DB_USER:-admin}
      QUARKUS_DATASOURCE_PASSWORD: ${MS_AUTH_DB_PASS:-admin}
    ports:
      - "9001:9001"
    networks:
      - vacaciones-net

  mcsv-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcsv-gateway
    container_name: mcsv-gateway
    depends_on:
      - ms-solicitud
      - ms-aprobaciones
      - ms-politicas
      - ms-notificaciones
    ports:
      - "8080:8080"
    networks:
      - vacaciones-net

  jovaca:
    image: node:20-alpine
    container_name: jovaca
    working_dir: /app
    command: sh -c "npm ci && npm run start -- --host 0.0.0.0 --port 4200"
    volumes:
      - ./jovaca:/app
    ports:
      - "4200:4200"
    depends_on:
      - mcsv-gateway
    networks:
      - vacaciones-net

volumes:
  postgres_data:
  mongo_data:

networks:
  vacaciones-net:
    driver: bridge
