version: '3.8'

services:
  # Base de Datos Relacional (Comandos - Write Model)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-vacaciones
    environment:
      POSTGRES_USER: vacaciones_user
      POSTGRES_PASSWORD: vacaciones_pass
      POSTGRES_MULTIPLE_DATABASES: db_solicitudes,db_aprobaciones,db_politicas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vacaciones-net

  # Base de Datos NoSQL (Consultas - Read Model / CQRS)
  mongodb:
    image: mongo:6.0
    container_name: mongodb-vacaciones
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vacaciones-net

  # Event Broker (Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-vacaciones
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vacaciones-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-vacaciones
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - vacaciones-net

  # UI para monitorear Topics y Mensajes en Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-vacaciones
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - vacaciones-net

volumes:
  postgres_data:
  mongo_data:

networks:
  vacaciones-net:
    driver: bridge
